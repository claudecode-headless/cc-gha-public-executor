# scheduler — the external monitoring daemon for the A2A swarm.
#
# Context (research/A2A-GH-NATIVE.md §4 in the private repo): the native
# `schedule` trigger is INTERMITTENT (multi-hour silent windows between partial
# firing — revived 2026-08-28 after a fully-dead window). This workflow is the
# PRIMARY driver, running on FREE public-repo compute with zero private-quota
# consumption.
#
# Task 36 upgrade — from "stall scanner" to a 4-duty monitoring daemon
# (docs/DIAGNOSTICS.md in the private repo is the runbook):
#
#   1. STALL SCAN (unchanged semantics): every 30 min → scan the private
#      repo's open issues for genuinely stalled a2a markers → dispatch ONE
#      lead sweep. Private quota is spent ONLY on actual stalls (a synthetic
#      turn), not monitoring cadence (~48 no-op sweeps/day would otherwise
#      burn ~1,400 min/mo against the 2,000 free-plan budget).
#   2. FAILURE WATCH (new): failed agent-workflow runs in the last 35 min are
#      attributed to their issue via the run-name ("issue-N · agent" — set on
#      the private repo's agent workflows), posted as a `[turn failed: run N]`
#      notice comment on that issue (never a silent drop), and — for worker
#      agents — trigger an immediate recovery sweep instead of waiting out the
#      40-min stall window. Window is 95 min (2x cadence: the schedule is
#      intermittent; run-id dedup makes overlap free). Circuit breaker: ≥3 failure notices in 6h on one
#      issue → notify-only (stop auto-recovery; human attention required).
#   3. BOARD SYNC (new): the per-issue state (In Progress / Stalled / Idle /
#      Failed + agent-on-hook) is mirrored onto the Projects v2 board — the
#      operator's single dashboard. Graceful degradation: needs a `project`-
#      scoped token (BOARD_PAT or an expanded GH_PAT_PRIVATE); without it the
#      step logs a skip and the scheduler continues normally (audited
#      2026-08-28: GH_PAT_PRIVATE carries repo+workflow only).
#   4. QUOTA TELEMETRY (new): a monthly private-minutes estimate line
#      (wall-clock sum of recent runs — a trend indicator, not billing).
#
# This workflow doubles as the public-repo schedule liveness probe: if it never
# fires, `schedule` is broken account-wide (not just on the private repo) and
# the driver must move to an external HTTP cron (any pinger service can POST
# /repos/<owner>/<repo>/dispatches with a PAT).
#
# LOG HYGIENE (public repo — every line is world-readable):
#   - issue NUMBERS only; never titles, bodies, comment text, run names, or
#     usernames (run names of older runs are commit subjects = content)
#   - never echo secret values; never cat private-repo file contents
name: External scheduler (swarm monitoring daemon)

on:
  schedule:
    # Off-peak minutes (avoid :00/:30 — GitHub's highest-load cron slots).
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: none

concurrency:
  # Serialize scans: overlapping manual + cron scans would double-notice and
  # double-dispatch. Queue (never cancel) — a scan is idempotent and cheap.
  group: scheduler-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_REPO: claudecode-headless/cc-gha-exploration
      GH_PAGER: ""
    steps:
      # SHA-pinned (a moved v4 tag would otherwise run with no PAT but still
      # executes third-party code on this secret-holding runner)
      - uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608  # v4.1.0
        with:
          persist-credentials: false

      - name: Monitor scan (stalls + failed turns + board state)
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PRIVATE }}  # step-scoped: only this step holds the PAT
        run: |
          set -eo pipefail
          # Agent roster: fetched LIVE from the private repo (no sync drift).
          REGISTRY=$(gh api "repos/${PRIVATE_REPO}/contents/.github/agents/registry.json" --jq '.content' | base64 -d)
          if ! printf '%s' "$REGISTRY" | jq -e '.agents' >/dev/null 2>&1; then
            echo "::error::registry fetch failed — aborting this scan (NOT proceeding with a zero-agent roster)"
            exit 1
          fi
          echo "registry loaded: $(printf '%s' "$REGISTRY" | jq '.agents | length') agents"
          ROSTER=$(printf '%s' "$REGISTRY" | jq -r '[.agents[].agent_id] | join(",")')
          echo "roster=${ROSTER}" >> "$GITHUB_OUTPUT"   # live roster for board-sync (no drift)
          rm -f /tmp/stalled /tmp/board-state.jsonl /tmp/failed-runs.jsonl /tmp/scanned-issues
          # ALWAYS create the state files (review 36-r1/r3 P1): a markerless
          # quiet repo is a HEALTHY state — it must produce an EMPTY state
          # file, not a missing one (board-sync would exit 1 and the failure
          # notices below would be silently skipped via success() gating).
          : > /tmp/board-state.jsonl
          : > /tmp/scanned-issues

          # ---- failure watch: failed agent-workflow runs in the window (95 min) ------
          # Attribution key: the private repo's agent workflows carry
          # run-name "issue-N · <agent>" (Task 36); runs older than that
          # change have no issue in their name and are unattributable (the
          # stall scan still covers their issues after 40 min). Run NAMES are
          # never logged — pre-change names are commit subjects (content).
          # Window = 2× cadence + slack: the native schedule is INTERMITTENT
          # (multi-hour gaps) — a 35-min window would miss every failure that
          # lands in a missed-tick gap. Run-id dedup makes overlap free.
          CUTOFF=$(date -u -d '-95 min' +%Y-%m-%dT%H:%M:%SZ)
          while read -r WF AGENT_ID; do
            [ -n "$WF" ] || continue
            if ! RUNS_JSON=$(gh run list -R "${PRIVATE_REPO}" --workflow "$WF" --limit 20 \
                --json databaseId,name,conclusion,createdAt 2>/dev/null); then
              echo "::warning::run list failed for ${WF} — failure watch may be blind for ${AGENT_ID} this cycle"
              continue
            fi
            printf '%s' "$RUNS_JSON" \
              | jq -c --arg cutoff "$CUTOFF" --arg agent "$AGENT_ID" \
                  '.[] | select(.conclusion == "failure" and .createdAt > $cutoff)
                   | {run_id: .databaseId, agent: $agent,
                      kind: ((.name | capture("^(?<k>issue|discussion)-")? | .k) // null),
                      issue: ((.name | capture("^(?:issue|discussion)-(?<n>[0-9]+)")? | .n | tonumber) // null)}
                   | select(.issue != null)' >> /tmp/failed-runs.jsonl || true
          done < <(printf '%s' "$REGISTRY" | jq -r '.agents[] | "\(.workflow) \(.agent_id)"')
          if [ -s /tmp/failed-runs.jsonl ]; then
            # dedup by run_id (one run may appear once per scan it's inside)
            jq -s 'unique_by(.run_id)' /tmp/failed-runs.jsonl > /tmp/failed.json
            FAILED_COUNT=$(jq 'length' /tmp/failed.json)
            echo "failure watch: ${FAILED_COUNT} failed agent run(s) in the last 95 min: $(jq -c '[.[] | {issue, agent, run_id}]' /tmp/failed.json)"
          else
            echo '[ ]' > /tmp/failed.json
            echo "failure watch: 0 failed agent runs in the last 95 min"
          fi
          echo "failed_count=$(jq 'length' /tmp/failed.json)" >> "$GITHUB_OUTPUT"

          # ---- stall scan + board state (all open issues, full pass) -------
          # Open issues of the private repo, newest-updated first. Numbers only.
          # pipefail (set above): a failed `gh issue list` now FAILS the step
          # visibly instead of silently scanning nothing (review 36-r3).
          gh issue list -R "${PRIVATE_REPO}" --state open --limit 10 --json number,updatedAt \
            --jq 'sort_by(.updatedAt) | reverse | .[] | "\(.number)"' | while read -r NUM; do
            # Newest-end read: the comments API ignores sort/direction (verified
            # live) — paginate then take the tail marker. A FAILED fetch marks
            # the issue UNKNOWN (not scanned): no board line AND no scanned-set
            # entry, so board-sync never removes its item on a transport error
            # (review 36-r3: partial scans must not mass-remove items).
            COMMENTS_JSON=$(gh api --paginate "repos/${PRIVATE_REPO}/issues/${NUM}/comments?per_page=100" 2>/dev/null || echo FETCH_FAILED)
            if [ "$COMMENTS_JSON" = "FETCH_FAILED" ]; then
              echo "issue #${NUM}: comments fetch failed — treated as unknown (no board change, no stall verdict)"
              continue
            fi
            echo "$NUM" >> /tmp/scanned-issues
            LAST=$(printf '%s' "$COMMENTS_JSON" | jq '[.[] | select(.body | contains("<!-- a2a:"))] | last // empty')
            [ -n "$LAST" ] && [ "$LAST" != "null" ] || continue
            MARKER_JSON=$(printf '%s' "$LAST" | jq -r '.body' | node a2a-marker.mjs 2>/dev/null || echo null)
            TO=$(printf '%s' "$MARKER_JSON" | jq -r '.to // empty')
            MKIND=$(printf '%s' "$MARKER_JSON" | jq -r '.kind // empty')
            MFROM=$(printf '%s' "$MARKER_JSON" | jq -r '.from // empty')
            CREATED=$(printf '%s' "$LAST" | jq -r '.created_at')
            AGE_MIN=$(( ($(date +%s) - $(date -d "$CREATED" +%s)) / 60 ))
            # Answered check: a reply from the addressee after the marker.
            ANSWERED=$(printf '%s' "$COMMENTS_JSON" | jq --arg to "$TO" --arg created "$CREATED" \
              '[.[] | select(.created_at > $created) | select(.body | contains("from: " + $to))] | length')

            board() { echo "{\"issue\": ${NUM}, \"status\": \"$1\", \"agent\": \"${2:-unassigned}\"}" >> /tmp/board-state.jsonl; }

            case "$TO" in
              ""|human) board Idle "$MFROM"; continue ;;
            esac
            # Informational kinds are not requests waiting on anyone.
            case "$MKIND" in
              notice|heartbeat) board Idle "$MFROM"; continue ;;
            esac
            # Re-nudge guard: our own unanswered nudge must not re-nudge.
            if [ "$MFROM" = "lead" ] && [ "$MKIND" = "handoff" ]; then
              echo "issue #${NUM}: last marker is the lead's own unanswered nudge — skip (dispatch)"
              # The BOARD still shows the truth: an unanswered nudge is stuck.
              if [ "$ANSWERED" = "0" ] && [ "$AGE_MIN" -ge 40 ]; then board Stalled "$TO"; else board "In Progress" "$TO"; fi
              continue
            fi
            # In-flight check: recent run of the addressee's workflow = not stalled.
            WF_FILE=$(printf '%s' "$REGISTRY" | jq -r --arg id "$TO" '.agents[] | select(.agent_id == $id) | .workflow' 2>/dev/null || echo "")
            INFLIGHT=0
            if [ -n "$WF_FILE" ]; then
              INFLIGHT=$(gh run list -R "${PRIVATE_REPO}" --workflow "$WF_FILE" --limit 5 --json status,createdAt 2>/dev/null \
                | jq --arg cutoff "$(date -u -d '-40 min' +%Y-%m-%dT%H:%M:%SZ)" '[.[] | select(.createdAt > $cutoff)] | length' || echo 0)
              if [ "${INFLIGHT:-0}" -gt 0 ]; then
                echo "issue #${NUM}: addressee workflow has ${INFLIGHT} recent run(s) — not stalled"
                board "In Progress" "$TO"
                continue
              fi
            fi
            echo "issue #${NUM}: last marker (kind=${MKIND}, ${AGE_MIN} min old, answered=${ANSWERED})"
            if [ "$ANSWERED" != "0" ]; then
              board Idle "$TO"
            elif [ "$AGE_MIN" -lt 40 ]; then
              board "In Progress" "$TO"
            elif [ "$AGE_MIN" -le 360 ]; then
              board Stalled "$TO"
              if [ ! -f /tmp/stalled ]; then
                echo "issue=${NUM}" > /tmp/stalled
                echo "STALLED: issue #${NUM} waiting on an agent for ${AGE_MIN} min"
              fi
            else
              board Idle "$TO"   # past the 360-min action window — at rest
            fi
          done
          if [ -f /tmp/stalled ]; then
            echo "issue=$(cat /tmp/stalled | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          else
            echo "issue=" >> "$GITHUB_OUTPUT"
            echo "no stalls detected"
          fi

          # ---- closed-issue sweep (board hygiene) ---------------------------
          # The open-issues loop only marks OPEN issues scanned; closed issues
          # would keep zombie board items forever (scanned-set removal guard
          # never fires for them). Recently-CLOSED issues join the scanned set
          # here: definitionally not agent-active, so board-sync retires their
          # items (the "board shows live work" contract). If an agent still
          # comments on a closed issue later, the item is simply re-added.
          CLOSED_COUNT=$(gh issue list -R "${PRIVATE_REPO}" --state closed --limit 10 --json number \
            --jq '.[] | "\(.number)"' >> /tmp/scanned-issues 2>/dev/null && wc -l < /tmp/scanned-issues || echo 0)
          echo "closed-issue sweep: scanned-set now ${CLOSED_COUNT} issues (open + recently closed)"

          # ---- merge failure overrides into the board state ----------------
          # Failed > any conversation-derived status; failed issues missing a
          # board line (e.g. prefix-triggered turn without markers) get one.
          # Task 37: discussion failures are EXCLUDED — the board mirrors
          # the issue namespace only (discussion numbers are a different
          # sequence; merging them would corrupt issue-numbered rows).
          if [ "$(jq 'length' /tmp/failed.json)" -gt 0 ]; then
            jq -s --argjson failed "$(jq '[.[] | select((.kind // "issue") == "issue")]' /tmp/failed.json)" '
              . as $board
              | ($failed | map({key: (.issue | tostring), value: .}) | from_entries) as $f
              | ($board | map(if ($f[(.issue | tostring)] != null) then .status = "Failed" else . end)
                 + ($f | to_entries
                     | map(select((.key | tonumber) as $n | ($board | map(.issue) | index($n)) == null)
                          | {issue: (.key | tonumber), status: "Failed", agent: .value.agent})))
            ' /tmp/board-state.jsonl 2>/dev/null | jq -c '.[]' > /tmp/board-state-merged.jsonl \
              && mv /tmp/board-state-merged.jsonl /tmp/board-state.jsonl \
              || echo "board merge: kept unmerged state (${?})"
          fi
          echo "board state: $(wc -l < /tmp/board-state.jsonl 2>/dev/null || echo 0) active issue(s)"

      - name: Board sync (Projects v2 mirror — graceful without project scope)
        env:
          GH_PAT_PRIVATE: ${{ secrets.GH_PAT_PRIVATE }}
          BOARD_PAT: ${{ secrets.BOARD_PAT }}   # optional project-scoped override
          GH_TOKEN: ${{ secrets.GH_PAT_PRIVATE }}  # for the REST node-id lookups inside the script (review 36-r1 P1: without it, board ADDS can never succeed)
          PRIVATE_REPO: claudecode-headless/cc-gha-exploration
          ROSTER: ${{ steps.scan.outputs.roster }}    # live roster (no registry drift)
        run: bash scripts/board-sync.sh /tmp/board-state.jsonl /tmp/scanned-issues

      - name: Dispatch private sweep (only when stalled)
        # always(): a board-sync failure must not silently skip the recovery
        # path (review 36-r1/r3 P1 — the steps below were success()-gated).
        if: always() && steps.scan.outputs.issue != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PRIVATE }}  # step-scoped: only this step holds the PAT
          ISSUE: ${{ steps.scan.outputs.issue }}   # env-indirected, never ${{ }} into run:
        run: |
          set -e
          # Circuit breaker (review 36-r3 P1): the stall dispatch is the
          # ORIGINAL recovery path and previously bypassed the failure-count
          # breaker — a sweep that keeps dying would be re-dispatched every
          # 30 min for the whole 40–360-min stall window. Same rule as the
          # failure-watch path: ≥3 turn-failed notices in 6h → stop, human.
          NOTICES=$(gh api --paginate "repos/${PRIVATE_REPO}/issues/${ISSUE}/comments?since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)&per_page=100" 2>/dev/null \
            | jq '[.[] | select(.body | startswith("**[turn failed:"))] | length' || echo 0)
          if [ "${NOTICES:-0}" -ge 3 ]; then
            echo "issue #${ISSUE}: circuit breaker open (${NOTICES} failure notices/6h) — stall dispatch suppressed, human attention required"
            exit 0
          fi
          T0=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "dispatching repository_dispatch {sweep} for issue #${ISSUE}"
          gh api -X POST "repos/${PRIVATE_REPO}/dispatches" \
            -f event_type="sweep" \
            -f "client_payload[issue_number]=${ISSUE}"
          # 204 only means ACCEPTED — verify a run was actually created (the
          # Task-35 review lesson: a silently dropped dispatch looks exactly
          # like a successful one for ~30 min).
          sleep 10
          CREATED=$(gh run list -R "${PRIVATE_REPO}" --event repository_dispatch --limit 3 \
            --json createdAt,status 2>/dev/null \
            | jq --arg t0 "$T0" '[.[] | select(.createdAt > $t0)] | length' || echo 0)
          if [ "${CREATED:-0}" -gt 0 ]; then
            echo "sweep run created and visible (created_at > ${T0})"
          else
            echo "::warning::dispatch accepted but no repository_dispatch run appeared within 10s — check the private repo's lead workflow state"
          fi

      - name: Failure notices + recovery dispatches
        # always(): board-sync or dispatch failures upstream must not suppress
        # failure notices (they are the "never a silent drop" guarantee).
        if: always() && steps.scan.outputs.failed_count != '' && steps.scan.outputs.failed_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PRIVATE }}
          STALLED_ISSUE: ${{ steps.scan.outputs.issue }}
        run: |
          set -e
          rm -f /tmp/dispatched-issues
          post_notice() { # post_notice <issue> <body> — retried once, never lies (review 36-r3 P1)
            if gh issue comment "$1" -R "${PRIVATE_REPO}" --body "$2" 2>/dev/null; then return 0; fi
            sleep 5
            if gh issue comment "$1" -R "${PRIVATE_REPO}" --body "$2" 2>/dev/null; then return 0; fi
            echo "::warning::failure notice for issue #$1 failed to post twice (rate limit?) — the Actions red X and the board Failed state remain the signals"
            return 1
          }
          jq -c '.[]' /tmp/failed.json | while read -r REC; do
            ISSUE=$(printf '%s' "$REC" | jq -r '.issue')
            KIND=$(printf '%s' "$REC" | jq -r '.kind // "issue"')
            RUN_ID=$(printf '%s' "$REC" | jq -r '.run_id')
            AGENT_ID=$(printf '%s' "$REC" | jq -r '.agent')
            # Thread-kind split (Task 37): discussion turns are noticed on
            # their discussion (GraphQL) but are NOT sweep-dispatched (the
            # synthetic sweep operates on the issue namespace) and NOT
            # board-merged (the board mirrors issues this session).
            if [ "$KIND" = "discussion" ]; then
              # dedup on the discussion's comments (REST honors since)
              RECENT=$(gh api --paginate "repos/${PRIVATE_REPO}/discussions/${ISSUE}/comments?since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)&per_page=100" 2>/dev/null || echo '[]')
              DEDUP=$(printf '%s' "$RECENT" | jq --arg tag "**[turn failed: run ${RUN_ID}]**" '[.[] | select(.body | startswith($tag))] | length')
              if [ "${DEDUP:-0}" -gt 0 ]; then
                echo "discussion #${ISSUE}: run ${RUN_ID} already noticed — skip"
                continue
              fi
              DNODE=$(gh api "repos/${PRIVATE_REPO}/discussions/${ISSUE}" --jq .node_id 2>/dev/null || echo "")
              if [ -n "$DNODE" ]; then
                jq -n --arg d "$DNODE" --arg b "**[turn failed: run ${RUN_ID}]** (auto — this notice triggers no agent turns) The ${AGENT_ID} turn started from this discussion failed in CI (infra/transient — not a refusal). The run log is in the private repo's Actions tab (run ${RUN_ID})." \
                  '{query: "mutation($d: ID!, $b: String!) { addDiscussionComment(input: {discussionId: $d, body: $b}) { comment { id } } }", variables: {d: $d, b: $b}}' \
                  | curl -sS -X POST https://api.github.com/graphql \
                      -H "Authorization: bearer ${GH_TOKEN}" -H "Content-Type: application/json" \
                      --data-binary @- --max-time 30 >/dev/null \
                  && echo "discussion #${ISSUE}: posted failure notice for run ${RUN_ID} (${AGENT_ID})" \
                  || echo "::warning::discussion failure notice for #${ISSUE} failed to post — the Actions red X remains the signal"
              else
                echo "::warning::discussion #${ISSUE} node id unavailable — notice skipped this cycle"
              fi
              continue
            fi
            # the stall dispatch (same scan) already covers this issue
            if [ "$ISSUE" = "${STALLED_ISSUE}" ]; then
              echo "issue #${ISSUE}: failure covered by the stall dispatch — notice only"
            fi
            RECENT=$(gh api --paginate "repos/${PRIVATE_REPO}/issues/${ISSUE}/comments?since=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)&per_page=100" 2>/dev/null || echo '[]')
            # dedup: one notice per failed run id (prefix-exact — agent replies
            # always start with the a2a marker, so they cannot collide)
            DEDUP=$(printf '%s' "$RECENT" | jq --arg tag "**[turn failed: run ${RUN_ID}]**" '[.[] | select(.body | startswith($tag))] | length')
            if [ "${DEDUP:-0}" -gt 0 ]; then
              echo "issue #${ISSUE}: run ${RUN_ID} already noticed — skip"
              continue
            fi
            NOTICES=$(printf '%s' "$RECENT" | jq '[.[] | select(.body | startswith("**[turn failed:"))] | length')
            if [ "${NOTICES:-0}" -ge 3 ]; then
              # circuit breaker: recurring failures → human attention, no auto-retry
              RECUR=$(printf '%s' "$RECENT" | jq '[.[] | select(.body | startswith("**[turn failed: recurring]**"))] | length')
              if [ "${RECUR:-0}" = "0" ]; then
                post_notice "$ISSUE" "**[turn failed: recurring]** (auto — this notice triggers no agent turns) ${NOTICES} agent-turn failures in the last 6 hours on this thread. Auto-recovery is PAUSED — a human should check the run logs and docs/DIAGNOSTICS.md before re-triggering (mention an agent to retry manually)." || true
              fi
              echo "issue #${ISSUE}: circuit breaker open (${NOTICES} notices/6h) — no dispatch"
              continue
            fi
            if post_notice "$ISSUE" "**[turn failed: run ${RUN_ID}]** (auto — this notice triggers no agent turns) The ${AGENT_ID} turn started from this thread failed in CI — infra/transient OR a permission refusal (the gate exits 1 on write-access violations; refusals of the cap/storm class post guard notices instead). The run log is in the private repo's Actions tab (run ${RUN_ID}) distinguishes them."; then
              echo "issue #${ISSUE}: posted failure notice for run ${RUN_ID} (${AGENT_ID})"
            fi
            # recovery: immediate sweep for WORKER failures (the lead's own
            # sweep failing must not dispatch another sweep — loop guard).
            # One dispatch per ISSUE per scan, even with several failed runs
            # (review 36-r1 P3).
            if [ "$AGENT_ID" != "lead" ] && [ "$ISSUE" != "${STALLED_ISSUE}" ] \
               && ! grep -qx "$ISSUE" /tmp/dispatched-issues 2>/dev/null; then
              echo "$ISSUE" >> /tmp/dispatched-issues
              if gh api -X POST "repos/${PRIVATE_REPO}/dispatches" \
                   -f event_type="sweep" \
                   -f "client_payload[issue_number]=${ISSUE}" 2>/dev/null; then
                echo "recovery sweep dispatched for issue #${ISSUE}"
              else
                echo "::warning::recovery dispatch for issue #${ISSUE} failed — the 40-min stall scan is the backstop"
              fi
            fi
          done

      - name: Private-quota estimate (telemetry)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_PRIVATE }}
        run: |
          # Trend line, NOT billing: wall-clock sum of the newest ≤200 runs
          # that started this calendar month (queue time included; billing
          # measures per-job compute). The billing API needs an admin-scoped
          # token (404 with repo-only — audited 2026-08-28).
          MONTH_START=$(date -u +%Y-%m-01T00:00:00Z)
          ESTIMATE=$(gh run list -R "${PRIVATE_REPO}" --limit 200 --json createdAt,updatedAt 2>/dev/null \
            | jq --arg ms "$MONTH_START" \
              '[.[] | select(.createdAt > $ms)]
               | map(((.updatedAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)
                    - (.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) / 60)
               | add // 0 | floor')
          echo "private-minutes estimate: ~${ESTIMATE} min of wall-clock across the newest ≤200 runs since ${MONTH_START} (trend line, not billing)"
