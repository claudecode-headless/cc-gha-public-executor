# Claude PR review of the PRIVATE repo, executed on FREE PUBLIC compute.
#
# The relay: cc-gha-exploration/.github/workflows/review-relay.yml (a ~10s
# private-side job) fires repository_dispatch {event_type: review} here with
# {pr_number, head_sha, base_sha}. This workflow does the heavy part (clone,
# diff, LLM review) on free public minutes and POSTs the review back to the
# private PR via the PAT — replacing ~10 min of private compute per review
# (claude-review.yml burned 283 private minutes in Aug 2026).
#
# LOG HYGIENE (public logs are world-readable):
#   - the DIFF and the REVIEW TEXT are never echoed (private code + private
#     deliverable). Both live in /tmp only; the review ships via the PAT API.
#   - diff stats are AGGREGATE counts only (numstat summed) — not even file
#     names reach the public log.
#
# SECURITY:
#   - payload validation: pr_number must be numeric, SHAs must be hex-40
#     (client_payload values never reach a shell unsanitized).
#   - READ-ONLY deploy keys for git (clone/fetch only — a leaked key cannot
#     push anything anywhere); PAT only for the final review POST.
#   - keys shredded (trap) before the review agent step; the review agent
#     runs --permission-mode plan (no writes, no command execution).
#   - trigger: repository_dispatch (owner-only actors can send it).
#   - failure is never silent: a failure-signal comment lands on the private PR.
name: Claude Review Private (public compute)

on:
  repository_dispatch:
    types: [review]

permissions: {}

concurrency:
  # a burst of pushes to the same PR: only the newest state matters — drop
  # in-flight reviews of stale SHAs instead of queueing them.
  group: review-${{ github.event.client_payload.pr_number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate dispatch payload
        env:
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          BASE_SHA: ${{ github.event.client_payload.base_sha }}
        run: |
          ok=1
          printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$' || { echo "::error::pr_number not numeric" >&2; ok=0; }
          printf '%s' "$HEAD_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::head_sha not hex-40" >&2; ok=0; }
          printf '%s' "$BASE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::base_sha not hex-40" >&2; ok=0; }
          [ "$ok" = "1" ] || exit 1
          echo "reviewing PR #$PR_NUMBER base=${BASE_SHA:0:7} head=${HEAD_SHA:0:7}"

      - name: Clone private repo at the PR merge ref (RO keys, shredded after)
        env:
          DK_RO: ${{ secrets.DEPLOY_KEY_REVIEW_RO }}
          DK_KIT_RO: ${{ secrets.DEPLOY_KEY_KIT_RO }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          BASE_SHA: ${{ github.event.client_payload.base_sha }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DK_RO"    > ~/.ssh/id_ro
          printf '%s\n' "$DK_KIT_RO" > ~/.ssh/id_kit_ro
          chmod 600 ~/.ssh/id_ro ~/.ssh/id_kit_ro
          # unconditional shred on any exit path
          trap 'rm -f ~/.ssh/id_ro ~/.ssh/id_kit_ro' EXIT
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'CFG'
          Host gh-private
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_ro
            IdentitiesOnly yes
          Host gh-kit
            HostName github.com
            User git
            IdentityFile ~/.ssh/id_kit_ro
            IdentitiesOnly yes
          CFG
          git config --global url."git@gh-kit:xfnwfpho1/claudecode-zai-agent-kit.git".insteadOf \
            "https://github.com/xfnwfpho1/claudecode-zai-agent-kit.git"
          # sanitized clone: single-branch only (agent-sessions corpus must
          # not ride along as refs)
          git clone --no-checkout --single-branch \
            git@gh-private:claudecode-headless/cc-gha-exploration.git repo
          cd repo
          # THE MERGE REF (server-computed post-merge result — the same ref
          # actions/checkout uses for pull_request events): review what the PR
          # will actually become, with base-side noise excluded. Fall back to
          # the raw SHAs if the merge ref is absent (conflicting PR).
          if git fetch origin "+refs/pull/${PR_NUMBER}/merge:pr-merge" --depth=200 2>/dev/null \
             && git rev-parse --verify pr-merge >/dev/null 2>&1; then
            MERGE_BASE=$(git rev-parse pr-merge^)
            MERGE_HEAD=$(git rev-parse pr-merge)
            git checkout -q pr-merge
            echo "using server merge ref ${MERGE_HEAD:0:7} (base ${MERGE_BASE:0:7})"
          else
            git fetch origin "$BASE_SHA" "$HEAD_SHA" --depth=200
            MERGE_BASE="$BASE_SHA"
            MERGE_HEAD="$HEAD_SHA"
            git checkout -q "$HEAD_SHA"
            echo "merge ref unavailable — falling back to two-SHA diff"
          fi
          git diff "$MERGE_BASE" "$MERGE_HEAD" > /tmp/review-diff.txt
          git submodule update --init 2>/dev/null || echo "(submodule fetch failed — continuing without kit context)"
          # AGGREGATE stats only — file names of private code stay out of the log
          FILES=$(git diff --numstat "$MERGE_BASE" "$MERGE_HEAD" | wc -l)
          INS=$(git diff --numstat "$MERGE_BASE" "$MERGE_HEAD" | awk '{s+=$1} END {print s+0}')
          DEL=$(git diff --numstat "$MERGE_BASE" "$MERGE_HEAD" | awk '{s+=$2} END {print s+0}')
          echo "diff aggregate: ${FILES} files, +${INS}/-${DEL} lines"
          # shred BEFORE the agent step (trap already covers failures)
          rm -f ~/.ssh/id_ro ~/.ssh/id_kit_ro
          trap - EXIT

      - name: Install Claude Code
        run: |
          npm install -g "@anthropic-ai/claude-code@2.1.241"
          claude --version

      - name: Run review (no git credentials; output to /tmp only)
        id: review
        timeout-minutes: 25
        env:
          ANTHROPIC_BASE_URL: "https://openrouter.ai/api"
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: "${{ vars.REVIEW_MODEL || 'z-ai/glm-5.3-flash' }}"
          CLAUDE_CODE_DISABLE_UNKNOWN_MODEL_WINDOW_ENFORCEMENT: "1"
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          cd repo
          # never echo the diff or the review — public log
          set +e
          claude -p "$(cat <<'PROMPT'
          Perform a rigorous code review of this pull request. The full diff is in /tmp/review-diff.txt; the repository is checked out at the PR merge ref — read any file for context.

          Focus on:
          1. Correctness: bugs, race conditions, error handling, edge cases.
          2. Security: credential hygiene, injection risks, untrusted input handling.
          3. GitHub Actions semantics: YAML correctness, permissions, concurrency groups.
          4. Docs accuracy: claims that contradict the code.

          Report findings as a numbered list with severity tags [P0]/[P1]/[P2]/[P3] and file:line citations. Ignore: credentials tracked in git (deliberate git-is-disk policy for this exploration repo) and informal tone. If nothing significant is wrong, say so plainly — do not pad. Your entire response is posted verbatim as the PR review; write it for that audience. CRITICAL: include ALL findings inline in your response — there is NO other delivery channel (no 'findings posted above', no external files; anything not in your final response is lost).
          PROMPT
          )" \
            --output-format json \
            --max-turns 40 \
            --permission-mode plan \
            --disallowedTools "WebFetch,WebSearch" \
            > /tmp/review-result.json 2>/tmp/review.stderr
          RC=$?
          set -e
          if [ $RC -ne 0 ] || ! jq -e '.result' /tmp/review-result.json >/dev/null 2>&1; then
            echo "::error::review step failed (rc=$RC) — metadata only:" >&2
            jq -r '"subtype=\(.subtype // "n/a") is_error=\(.is_error // "n/a")"' /tmp/review-result.json 2>/dev/null || echo "(no parseable JSON)"
            exit 1
          fi
          jq -r '.result' /tmp/review-result.json > /tmp/review.md
          echo "review produced: $(wc -c < /tmp/review.md) bytes (content not echoed — private deliverable)"
          jq '{subtype, is_error, num_turns, duration_ms, usage: {output_tokens: .usage.output_tokens}}' /tmp/review-result.json

      - name: POST review to the private PR (PAT; retried; result never in public log)
        env:
          GH_PAT_PRIVATE: ${{ secrets.GH_PAT_PRIVATE }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
        run: |
          python3 - <<'EOF'
          import json, os, time, urllib.request
          pr = os.environ["PR_NUMBER"]
          pat = os.environ["GH_PAT_PRIVATE"]
          review = open("/tmp/review.md").read()
          if not review.strip():
              print("empty review — not posting"); raise SystemExit(0)
          body = {"body": f"**Claude review (public-compute executor)** — head `{os.environ['HEAD_SHA'][:7]}`\n\n{review}", "event": "COMMENT"}
          req = urllib.request.Request(
              f"https://api.github.com/repos/claudecode-headless/cc-gha-exploration/pulls/{pr}/reviews",
              method="POST",
              headers={"Authorization": f"token {pat}", "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              data=json.dumps(body).encode())
          last_err = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      out = json.loads(r.read())
                      print(f"review posted: id={out['id']} state={out['state']} (attempt {attempt+1})")
                      raise SystemExit(0)
              except urllib.error.HTTPError as e:
                  last_err = e
                  if e.code in (403, 404):  # deterministic — do not retry
                      raise
                  time.sleep(5 * (attempt + 1))
              except Exception as e:
                  last_err = e
                  time.sleep(5 * (attempt + 1))
          print(f"::error::review POST failed after 3 attempts: {last_err}")
          raise SystemExit(1)
          EOF

      - name: Signal failure to the private PR (never a silent drop)
        if: failure()
        env:
          GH_PAT_PRIVATE: ${{ secrets.GH_PAT_PRIVATE }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request
          pr, pat = os.environ["PR_NUMBER"], os.environ["GH_PAT_PRIVATE"]
          body = {"body": f"**Executor review FAILED** for head `{os.environ['HEAD_SHA'][:7]}` (public run {os.environ['RUN_ID']}). "
                          "No automated review was produced — check the executor run log (metadata only), re-dispatch, "
                          "or re-enable the private claude-review.yml fallback."}
          req = urllib.request.Request(
              f"https://api.github.com/repos/claudecode-headless/cc-gha-exploration/issues/{pr}/comments",
              method="POST",
              headers={"Authorization": f"token {pat}", "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"},
              data=json.dumps(body).encode())
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"failure signal posted to PR #{pr} (comment {r.status})")
          except Exception as e:
              print(f"::error::could not signal failure either: {e}")
              raise SystemExit(1)  # the job is already failed; make the relay failure loud
          EOF

      - name: Report (metadata only)
        if: always()
        run: echo "review pipeline done — all content shipped privately; only metadata in this public log"
